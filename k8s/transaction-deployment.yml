apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: uat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      containers:
      - name: transaction-service
        image: k8s-gitops-platform-transaction-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001