apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: uat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: k8s-gitops-platform-notification-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3002