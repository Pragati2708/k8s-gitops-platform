version: '3'

services:
  legacy-service:
    build: ./apps/legacy-service
    ports:
      - "3000:3000"

  transaction-service:
    build: ./apps/transaction-service
    ports:
      - "3001:3001"
    depends_on:
      - legacy-service

  notification-service:
    build: ./apps/notification-service
    ports:
      - "3002:3002"
